# Reusable workflow: builds the page for the calling course repo from its
# site.yaml (or site.json) and deploys it to Cloudflare under <domain>/<slug>/.
name: Publish course page

on:
  workflow_call:
    inputs:
      domain:
        type: string
        default: tm.veerhoek.eu
      zone:
        type: string
        default: veerhoek.eu
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: true
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out course repo
        uses: actions/checkout@v4
        with:
          path: course
          # Full history without blobs: build.ts dates each document by its last commit.
          fetch-depth: 0
          filter: blob:none

      - name: Check out generator
        uses: actions/checkout@v4
        with:
          repository: lmgveerhoek/tm-site
          path: tm-site

      # Bun and Typst, at the versions pinned in tm-site/mise.toml.
      - uses: jdx/mise-action@v2
        with:
          working_directory: tm-site

      # Liberation Sans stands in for Arial; Ghostscript downsamples PDFs above 25 MiB.
      - name: Install fonts and Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript fonts-liberation fonts-dejavu-core

      - name: Build
        working-directory: tm-site
        run: bun build.ts --repo ../course --out ../dist

      # Without the Cloudflare secrets the build still runs as a check.
      - name: Write Worker config
        if: env.HAS_TOKEN == 'true'
        run: |
          slug=$(ls dist)
          cat > wrangler.json <<JSON
          {
            "name": "tm-$slug",
            "compatibility_date": "2026-09-01",
            "workers_dev": false,
            "assets": { "directory": "dist" },
            "routes": [
              { "pattern": "${{ inputs.domain }}/$slug", "zone_name": "${{ inputs.zone }}" },
              { "pattern": "${{ inputs.domain }}/$slug/*", "zone_name": "${{ inputs.zone }}" }
            ]
          }
          JSON

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: bunx wrangler@4 deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
