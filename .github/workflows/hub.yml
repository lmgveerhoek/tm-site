# Deploys the landing page and shared stylesheet to the root of the domain.
name: Publish hub

on:
  push:
    branches: [main]
    paths: [hub/**, dashboard-check.ts, .github/workflows/hub.yml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Validate dashboard snapshot
        run: bun dashboard-check.ts
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: bunx wrangler@4 deploy --config hub/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
