[tools]
bun = "1.4.2"
typst = "0.15.1"

[tasks.build]
description = "Build one course page: mise run build -- ../TM12001-advanced-signal-acquisition"
run = "bun build.ts --out dist --repo"

[tasks.preview]
description = "Serve dist/ on http://localhost:8765 with the landing page"
run = "cp -R hub/public/. dist/ && bun preview.ts"

[tasks.cloudflare-secrets]
description = "Sync Cloudflare Actions secrets from 1Password to all six repos (also for rotation)"
run = "bun cloudflare-secrets.ts"

[tasks.video]
description = "Publish a recording: mise run video -- --repo <course> --file <rec> --name <name> --title <title>"
run = "bin/tm-video"
